name: Playwright Tests

# Placeholder: the previous target app was retired and tests/ is empty. This workflow only runs
# when triggered by hand. Restore push/pull_request triggers, the browser matrix and BASE_URL
# once the new target app and its specs exist.
on:
  workflow_dispatch:

jobs:
  test:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --pass-with-no-tests
